# Proxy inverse nginx pour OGADE — serveur de développement EDF
#
# Installation :
#   sudo cp /opt/ogade/deploy/edf/nginx-ogade.conf /etc/nginx/sites-available/ogade
#   sudo ln -s /etc/nginx/sites-available/ogade /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS n'est pas optionnel ici : le scanner de QR codes repose sur
# getUserMedia(), que les navigateurs réservent aux contextes sécurisés.
# En HTTP simple, la caméra ne s'ouvrira pas — sans message d'erreur
# explicite.

server {
    listen 80;
    server_name ogade-dev.interne.edf.fr;

    # Redirection vers HTTPS. À commenter uniquement pour une phase de test
    # sans certificat, en acceptant que le scanner QR soit inopérant.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ogade-dev.interne.edf.fr;

    ssl_certificate     /etc/ssl/certs/ogade.crt;
    ssl_certificate_key /etc/ssl/private/ogade.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Doit rester supérieur ou égal à MAX_UPLOAD_MB (défaut : 25 Mo).
    # Si nginx est plus restrictif, il rejette la requête avant
    # l'application et le message applicatif — qui indique la limite — n'est
    # jamais renvoyé.
    client_max_body_size 30m;

    access_log /var/log/nginx/ogade-access.log;
    error_log  /var/log/nginx/ogade-error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Les exports PDF et les téléchargements de fichiers volumineux
        # peuvent dépasser les délais par défaut.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Les fichiers étant servis depuis la base, la mise en tampon
        # complète des réponses est inutile et pénalise la latence.
        proxy_buffering off;
    }

    # ─── Documentation Swagger ────────────────────────────────────
    # Accessible sur ce serveur de développement. Pour la restreindre sans
    # toucher à l'application, décommenter le bloc suivant et adapter le
    # sous-réseau autorisé.
    #location /api/docs {
    #    allow 10.0.0.0/8;
    #    deny all;
    #    proxy_pass http://127.0.0.1:3000;
    #    proxy_set_header Host $host;
    #}
}
