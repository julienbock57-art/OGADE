# nginx devant OGADE, serveur de dev EDF
#
# Pour l'installer :
#   sudo cp /opt/ogade/deploy/edf/nginx-ogade.conf /etc/nginx/sites-available/ogade
#   sudo ln -s /etc/nginx/sites-available/ogade /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Le HTTPS n'est pas juste "recommande" ici : le scan de QR code utilise
# getUserMedia(), que les navigateurs n'autorisent qu'en contexte securise.
# En HTTP simple la camera ne s'ouvre pas, et sans message d'erreur en plus.

server {
    listen 80;
    server_name ogade-dev.interne.edf.fr;

    # Redirection vers HTTPS. A commenter seulement pour un test rapide sans
    # certificat, en sachant que le scan QR ne marchera pas.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ogade-dev.interne.edf.fr;

    ssl_certificate     /etc/ssl/certs/ogade.crt;
    ssl_certificate_key /etc/ssl/private/ogade.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # A garder au moins egal a MAX_UPLOAD_MB (25 Mo par defaut).
    # Si nginx est plus strict que l'appli, c'est lui qui refuse en premier et
    # l'utilisateur n'a jamais le message qui indique la limite.
    client_max_body_size 30m;

    access_log /var/log/nginx/ogade-access.log;
    error_log  /var/log/nginx/ogade-error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Les exports PDF et les gros telechargements peuvent depasser les
        # timeouts par defaut.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Les fichiers viennent de la base, donc pas la peine de tout mettre en
        # tampon, ca ne fait qu'ajouter de la latence.
        proxy_buffering off;
    }

    # --- La doc Swagger ---
    # On la laisse accessible sur ce serveur de dev. Si un jour on veut la
    # restreindre sans toucher a l'appli, decommenter le bloc et adapter le
    # reseau autorise.
    #location /api/docs {
    #    allow 10.0.0.0/8;
    #    deny all;
    #    proxy_pass http://127.0.0.1:3000;
    #    proxy_set_header Host $host;
    #}
}
