name: Deploy to Azure App Service

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Extract last merged PR number
        id: pr
        run: |
          NUM=$(git log --merges --grep='Merge pull request' -n 1 --pretty=format:%s 2>/dev/null \
            | grep -oE '#[0-9]+' | head -n1 | tr -d '#')
          if [ -z "$NUM" ]; then
            NUM=$(git log -n 1 --pretty=format:%s | grep -oE '#[0-9]+' | head -n1 | tr -d '#')
          fi
          NUM=${NUM:-0}
          echo "Detected PR number: $NUM"
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_PR_NUMBER=${{ steps.pr.outputs.number }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ogade:latest
            ghcr.io/${{ github.repository_owner }}/ogade:${{ github.sha }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          images: ghcr.io/${{ github.repository_owner }}/ogade:${{ github.sha }}
